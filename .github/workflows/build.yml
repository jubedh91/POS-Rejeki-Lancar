name: Bangun APK POS Rejeki Lancar

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil Kode dari Repository
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Buat Proyek Android
        run: |
          npm install
          npx cap add android

      - name: Aktifkan Izin Kamera & Internet Otomatis di Android
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>\n    <uses-feature android:name="android.hardware.camera" android:required="false" \/>\n    <application/g' "$MANIFEST"
          npx cap sync android

      - name: Rakit File APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Unggah Hasil APK Siap Download
        uses: actions/upload-artifact@v4
        with:
          name: POS-Rejeki-Lancar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
